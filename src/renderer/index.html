<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonts are bundled locally (see main.jsx), so nothing external is allowed.

       `connect-src` allows loopback WebSockets because that is how a remote
       desktop reaches its bridge: the main process listens on 127.0.0.1 on an
       ephemeral port, so the port cannot be named here and is wildcarded. It
       stays a loopback-only allowance, and the bridge itself only accepts a
       single connection bearing a 128-bit token it just issued.

       `wasm-unsafe-eval` is what lets an RDP pane exist: the session is driven
       by IronRDP compiled to WebAssembly, and Chromium will not compile a
       module at all under a `script-src` that does not say so. It permits
       WebAssembly compilation and nothing else; `unsafe-eval`, which would
       also open `eval` and `new Function` to JavaScript, is still refused. The
       module arrives as bytes over IPC rather than from a URL, so no source
       needs to be allowed here either. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:*">
  <title>CloudTerm</title>
  <script src="./boot.js"></script>
  <link rel="stylesheet" href="./xterm.css">
  <link rel="stylesheet" href="./input.css">
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>
  <!-- What the window shows while the bundle loads. Plain markup, with the
       logo drawn inline rather than fetched, so it paints with the stylesheet
       before any script has run; boot.js says whether this window shows it,
       and lib/boot-splash.js sends it off once the app has drawn. -->
  <div id="boot-splash" class="boot-splash" aria-hidden="true">
    <div class="boot-splash-mark">
      <div class="boot-splash-float">
        <svg class="boot-splash-logo" viewBox="0 0 159 132" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path opacity="0.8" d="M147.903 56.4801C141.988 49.2327 133.837 44.2036 124.756 42.1989C122.761 32.9202 119.089 24.852 113.901 18.236C113.761 18.0066 113.6 17.7907 113.422 17.5905C95.9418 -3.7907 67.2871 -3.71003 47.9709 7.34358C31.4483 16.8645 17.4005 36.9545 24.7436 65.7584C7.82222 69.9542 0 84.8806 0 98.3547C0 113.443 9.73786 130.467 31.5282 132H114.061C125.395 132 136.17 127.804 144.471 120.059C164.585 102.308 161.952 73.1814 147.903 56.4801Z" fill="url(#boot-splash-fill)"/>
          <defs>
            <linearGradient id="boot-splash-fill" x1="79.5001" y1="0" x2="79.5001" y2="132" gradientUnits="userSpaceOnUse">
              <stop stop-color="#307AF0"/>
              <stop offset="1" stop-color="#0FCBE3"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="boot-splash-glint"></div>
      </div>
    </div>
    <div class="boot-splash-track"><span class="boot-splash-sweep"></span></div>
  </div>
  <script type="module" src="./main.jsx"></script>
</body>

</html>
