# Build every platform and attach the results to a GitHub Release.
#
# One machine cannot do this. The app carries native binaries that npm installs
# per platform and architecture (the Claude CLI inside @anthropic-ai, and the
# serialport bindings), and npm only ever fetches the set for the host it runs
# on. A macOS package built on Windows would have no Claude binary at all. So
# each entry below installs and builds on its own runner, and the release job
# collects what they produce.
#
# Push a tag to publish:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Running it by hand from the Actions tab builds the same artifacts and uploads
# them for download without creating a release, which is the way to test a
# change to this file.
#
# The release carries more than the installers. electron-builder writes a
# `latest*.yml` beside each build describing what it just made, and the
# `.blockmap` files next to them are what let an update download only the parts
# that changed. Those are what the app reads to update itself, so a release
# missing them is a release nobody can update to. `--publish never` below only
# turns off uploading; the manifests are written either way, and a step in each
# build job fails if one is not.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny you the other four.
      fail-fast: false
      matrix:
        include:
          # Both Windows targets at once: an installer for people who want the
          # app on their machine, and the portable exe for people who cannot
          # install anything. 64-bit only. The 32-bit build could never run the
          # assistant, whose CLI is x64, and nothing was gained by shipping the
          # rest of the app without it.
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          # Both macOS builds run on Apple silicon. macos-13 was the last Intel
          # runner and queues forever now that it is being retired, so the
          # Intel dmg is cross-built. Packaging never executes the app, it only
          # copies binaries, so the host architecture does not matter there.
          #
          # It matters a great deal to npm, though, and in two directions at
          # once. The install has to be native or the renderer cannot build,
          # because rollup loads a binary for the machine it is running on. The
          # Claude CLI is the opposite: it has to match the machine the dmg is
          # for. So the install stays native and claude-target names the one
          # package swapped afterwards, once the build tools have done their
          # work and only the shipped binary is still in question.
          #
          # `--mac` and not `--mac dmg`, so the zip in the mac target list gets
          # built too. Squirrel updates a mac app from a zip and will not touch
          # a dmg, so the dmg is what a person downloads and the zip is what the
          # app downloads.
          - name: macos-x64
            os: macos-latest
            args: --mac --x64
            claude-target: darwin-x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux AppImage --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm exposes global CLIs as `.cmd` shims on Windows. This starts the
      # actual OpenCode server through that shim, connects through its SDK,
      # and tears down the full process tree without sending a model prompt.
      - name: Smoke test native OpenCode integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./node_modules/@opencode-ai/sdk/package.json').version"
          npm install --global "opencode-ai@$version"
          node scripts/smoke-opencode-provider.js

      # Compiles against the C# compiler and WinRT metadata that ship inside
      # Windows. The script no-ops elsewhere, but there is no reason to call it.
      - name: Build the Windows Hello helper
        if: runner.os == 'Windows'
        run: npm run build:hello

      - run: npm run build:renderer

      # Only the cross-built Intel dmg gets here. Everything above needed the
      # host's own binaries, so npm installed the host's Claude one too. The
      # renderer is built by now and nothing else runs locally, so the shipped
      # binary can be put right: bring in the target's and drop every other,
      # leaving exactly one for electron-builder to package.
      - name: Swap in the target's Claude binary
        if: matrix.claude-target != ''
        shell: bash
        run: |
          set -e
          target='${{ matrix.claude-target }}'
          version=$(node -p "require('./node_modules/@anthropic-ai/claude-agent-sdk/package.json').version")

          # npm pack only downloads. `npm install` was the obvious way to do
          # this and the wrong one: it re-resolves the whole tree, which
          # reinstates optional dependencies that later steps have removed.
          tarball=$(npm pack "@anthropic-ai/claude-agent-sdk-${target}@${version}" 2>/dev/null | tail -1)

          # Only once the download is in hand, so a failure here does not leave
          # the build with no binary at all. The glob needs the trailing dash,
          # which is what keeps it off the SDK package itself.
          rm -rf node_modules/@anthropic-ai/claude-agent-sdk-*
          mkdir -p "node_modules/@anthropic-ai/claude-agent-sdk-${target}"
          tar -xzf "$tarball" -C "node_modules/@anthropic-ai/claude-agent-sdk-${target}" --strip-components=1
          rm -f "$tarball"

      # ssh2 lists cpu-features as an optional dependency and uses it only to
      # prefer a hardware-accelerated cipher, behind a bare try/catch. It is
      # built with nan, and nan does not compile against Electron 43's V8
      # headers: External::New and GetAlignedPointerFromInternalField both grew
      # a required tag argument. So @electron/rebuild fails on any runner that
      # has a compiler to try it with.
      #
      # Windows never had it installed at all, npm having skipped it there,
      # which is the only reason that build has ever worked. Removing it puts
      # macOS and Linux in the same position rather than a worse one.
      #
      # Last thing before packaging, deliberately. Anything that runs npm can
      # bring it back, so this wants to be after everything that might.
      - name: Drop cpu-features, which cannot build against this Electron
        shell: bash
        run: rm -rf node_modules/cpu-features

      # If the wrong one is here the build still succeeds and the assistant is
      # dead on arrival, so it gets a line in the log rather than being a
      # surprise inside a shipped dmg.
      - name: Show which Claude binary this build will carry
        shell: bash
        run: ls node_modules/@anthropic-ai/ | grep claude-agent-sdk- || echo 'NONE FOUND'

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # There is no signing certificate on a CI runner. Without this,
          # electron-builder hunts for one and fails the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The app reads this file to find out a release exists, so a build that
      # did not write one produces an installer nobody can update from, and
      # nothing else about the build looks wrong. Printed as well as checked:
      # the version and the file names in it are worth a glance in the log.
      - name: Check the update manifest was written
        shell: bash
        run: |
          set -e
          case "${{ matrix.name }}" in
            windows-*) manifest=latest.yml ;;
            macos-*)   manifest=latest-mac.yml ;;
            linux-*)   manifest=latest-linux.yml ;;
          esac

          if [ ! -f "dist/$manifest" ]; then
            echo "dist/$manifest was not written. electron-builder produces it"
            echo "from build.publish in package.json; check that it is still there."
            ls -l dist
            exit 1
          fi

          cat "dist/$manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual run stops after the build job, so the
    # artifacts can be inspected without anything going out.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # For scripts/merge-update-manifests.js, and nothing else. No npm install:
      # the script has no dependencies precisely so this step can stay this
      # cheap.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the builds
        run: |
          set -e

          # Every runner writes into its own directory, so flatten first. The
          # names carry their platform and architecture, so nothing collides.
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.zip' -o -name '*.blockmap' \) \
            -exec mv {} . \;

          # One runner each, so these move like the binaries do.
          find artifacts \( -name 'latest.yml' -o -name 'latest-linux.yml' \) -exec mv {} . \;

          # macOS is the exception. Two runners each wrote a latest-mac.yml
          # describing only its own architecture, and moving them both here
          # would leave whichever landed second. Merged instead, because an
          # Intel Mac reading an arm64-only manifest does not fail: it quietly
          # downloads the arm64 build.
          node scripts/merge-update-manifests.js latest-mac.yml \
            $(find artifacts -name 'latest-mac.yml' | sort)

          ls -lh *.exe *.dmg *.AppImage *.zip *.yml

      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The manifests and blockmaps go up with the installers. The app looks
          # for them by name on the release, so a release without them is one
          # the previous version cannot update to.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            *.exe *.dmg *.AppImage *.zip *.blockmap *.yml
